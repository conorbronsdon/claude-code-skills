# ClawHub publishing manifest.
#
# Single source of truth for what this repo publishes to clawhub.ai and how it
# is catalogued. `.github/workflows/clawhub.yml` reads this file, compares each
# `version` against what the registry already holds, and publishes only what
# changed.
#
# To ship a skill update: edit the skill, bump its `version` here, merge to
# main. Forgetting the bump means the change does not reach ClawHub — that is
# deliberate, and the workflow warns, naming the skill, when a folder's content
# no longer matches the version published under it.
#
# Why a manifest rather than frontmatter: unofficial frontmatter keys add
# listing noise in every consumer that renders SKILL.md, a tradeoff already
# declined once (skills-portfolio-roadmap.md, "skill.yaml common contract —
# deferred"). Versions are semver and independent per skill.
#
# These versions are ClawHub's, and nothing else reads them: no SKILL.md in this
# repo carries a frontmatter `version:`, so there is no second copy to drift
# from. The registry rejects a publish at a version that already exists —
# `Version X already exists. Increment the version number and try again.`, thrown
# unconditionally by the insert mutation (openclaw/clawhub, convex/skills.ts:12977
# in `insertVersion`, with a second staged check at convex/lib/skillPublish.ts:229).
# Read from source, not by trying it. There is no overwrite and no revision: the
# check does not exclude soft-deleted versions, so deleting a version does not
# free its number either. Bumping is the only way to change what is published.
#
# Category slugs the registry recognizes:
#   agents automation communication creative development finance
#   integrations knowledge operations other productivity research security
#
# Deliberately absent: any skill whose SKILL.md is written around Conor's
# private repo layout. Those live in personal-context and are not publishable.

